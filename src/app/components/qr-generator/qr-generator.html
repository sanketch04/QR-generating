<div class="qr-container">
  <!-- Language Selection -->
  <div class="language-section">
    <label for="language">
      {{ 'LANGUAGE.SELECT' | translate }}
    </label>

    <select id="language" [(ngModel)]="currentLanguage" (change)="changeLanguage(currentLanguage)">
      <option value="en">
        {{ 'LANGUAGE.ENGLISH' | translate }}
      </option>

      <option value="es">
        {{ 'LANGUAGE.SPANISH' | translate }}
      </option>

      <option value="hi">
        {{ 'LANGUAGE.HINDI' | translate }}
      </option>

      <option value="mr">
        {{ 'LANGUAGE.MARATHI' | translate }}
      </option>
      <option value="ru">
        {{ 'LANGUAGE.RUSSIAN' | translate }}
      </option>
    </select>
  </div>

  <!-- Heading -->
  <h1>
    {{ 'QR.TITLE' | translate }}
  </h1>

  <p class="subtitle">
    {{ 'QR.SUBTITLE' | translate }}
  </p>

  <!-- Input -->
  <div class="form-group">
    <label for="qrData">
      {{ 'QR.INPUT_LABEL' | translate }}
    </label>

    <input
      id="qrData"
      type="text"
      [(ngModel)]="qrData"
      [placeholder]="'QR.INPUT_PLACEHOLDER' | translate"
    />
  </div>

  <!-- Generate Button -->
  <button type="button" class="generate-btn" (click)="generateQRCode()">
    {{ 'QR.GENERATE' | translate }}
  </button>

  <!-- QR Code -->
  <div class="qr-preview">
    <qrcode
      [qrdata]="qrData"
      [width]="300"
      [errorCorrectionLevel]="'H'"
      [imageSrc]="logoUrl"
      [imageWidth]="logoSize"
      [imageHeight]="logoSize"
      (qrCodeURL)="onQRCodeURL($event)"
    >
    </qrcode>
  </div>

  <!-- Download -->
  @if (qrCodeDownloadLink) {
    <div class="download-buttons">
      <a [href]="qrCodeDownloadLink" download="angular-qr-code.png" class="download-btn">
        {{ 'QR.DOWNLOAD' | translate }}
      </a>
    </div>
  }
</div>
